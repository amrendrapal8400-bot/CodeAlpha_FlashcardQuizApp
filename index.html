<!DOCTYPE html>
<html>
<head>
    <title>Flashcard Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Flashcard Quiz App</h1>

    <div class="card">
        <h2 id="question">Question Here</h2>
        <p id="answer" style="display:none;">Answer Here</p>
    </div>

    <button onclick="showAnswer()">Show Answer</button>
    <button onclick="prevCard()">Previous</button>
    <button onclick="nextCard()">Next</button>

    <h3>Add Flashcard</h3>
    <input id="newQuestion" placeholder="Enter Question">
    <input id="newAnswer" placeholder="Enter Answer">
    <button onclick="addCard()">Add Card</button>
</div>

<script src="script.js"></script>

<button onclick="editCard()">Edit Current Card</button>
<button onclick="deleteCard()">Delete Current Card</button>
</body>
</html>
